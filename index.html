<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Download the App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --bg-soft: #121212;
    --card: #151515;
    --line: #262626;
    --ink: #f2f0ec;
    --ink-dim: #9a958c;
    --sun: #f6b24b;
    --dawn: #e8703a;
    --road: #7d7669;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow-x: hidden;
  }

  /* Ambient horizon glow, echoing the mark's sunrise-over-road motif */
  body::before {
    content: "";
    position: absolute;
    top: -10%;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 900px;
    max-width: 180vw;
    background: radial-gradient(circle, rgba(246,178,75,0.16) 0%, rgba(232,112,58,0.07) 35%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  main {
    width: 100%;
    max-width: 460px;
    padding: 72px 28px 40px;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .mark {
    width: 84px;
    height: 84px;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--line), 0 20px 50px -18px rgba(246,178,75,0.35);
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .mark img {
    width: 100%;
    height: 100%;
    display: block;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(28px, 7vw, 36px);
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin-top: 28px;
    max-width: 20ch;
  }

  p.sub {
    color: var(--ink-dim);
    font-size: 16px;
    line-height: 1.55;
    margin-top: 14px;
    max-width: 34ch;
  }

  .download {
    margin-top: 36px;
    width: 100%;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px 24px;
    background: linear-gradient(135deg, var(--sun), var(--dawn));
    color: #14100a;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 16px;
    text-decoration: none;
    border-radius: 14px;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    box-shadow: 0 14px 30px -14px rgba(232,112,58,0.55);
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 18px 36px -14px rgba(232,112,58,0.7);
  }

  .btn:active { transform: translateY(0); }

  .btn svg { width: 18px; height: 18px; flex-shrink: 0; }

  .music-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    top: calc(20px + env(safe-area-inset-top, 0px));
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.18s ease, border-color 0.18s ease;
    z-index: 10;
  }

  .music-toggle:hover {
    border-color: var(--sun);
    transform: translateY(-2px);
  }

  .music-toggle svg { width: 15px; height: 15px; flex-shrink: 0; }

  .meta {
    margin-top: 14px;
    font-size: 13px;
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .meta .dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--road);
    flex-shrink: 0;
  }

  footer {
    width: 100%;
    max-width: 460px;
    padding: 0 28px calc(28px + env(safe-area-inset-bottom, 0px));
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    margin-top: auto;
  }

  .socials {
    display: flex;
    gap: 22px;
  }

  .social {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 14px;
    border: 1px solid var(--line);
    border-radius: 100px;
    transition: color 0.18s ease, border-color 0.18s ease;
  }

  .social:hover {
    color: var(--sun);
    border-color: rgba(246,178,75,0.4);
  }

  .social svg { width: 16px; height: 16px; }

  .credit {
    font-size: 13px;
    color: var(--road);
  }

  .credit strong {
    color: var(--ink-dim);
    font-weight: 600;
  }

  @media (max-width: 380px) {
    main { padding-top: 56px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .mark { animation: none; }
    .btn { transition: none; }
  }
</style>
</head>

  </svg>
  <span id="musicLabel">Play music</span>
</button>

<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
<script>
  let spotifyController = null;
  let isPlaying = false;

  const toggleBtn = document.getElementById('musicToggle');
  const musicLabel = document.getElementById('musicLabel');
  const musicIcon = document.getElementById('musicIcon');

  const PLAY_ICON = '<path d="M6 4L18 12L6 20V4Z" fill="currentColor"/>';
  const STOP_ICON = '<rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/>';

  function setUI(playing) {
    isPlaying = playing;
    musicLabel.textContent = playing ? 'Stop music' : 'Play music';
    musicIcon.innerHTML = playing ? STOP_ICON : PLAY_ICON;
    toggleBtn.setAttribute('aria-pressed', String(playing));
  }

  window.onSpotifyIframeApiReady = (IFrameAPI) => {
    const element = document.getElementById('spotify-embed');
    const options = {
      uri: 'spotify:track:6uRjiSdbK7aX0nONhn4n1k',
      width: '1',
      height: '1'
    };
    IFrameAPI.createController(element, options, (EmbedController) => {
      spotifyController = EmbedController;
      spotifyController.addListener('playback_update', (e) => {
        setUI(!e.data.isPaused);
      });
    });
  };

  toggleBtn.addEventListener('click', () => {
    if (!spotifyController) return;
    if (isPlaying) {
      spotifyController.pause();
    } else {
      spotifyController.play();
    }
  });
</script>
